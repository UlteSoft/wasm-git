[package]
name = "wasm-git"
version = "0.1.0"
edition = "2021"
description = "Lossless core WebAssembly auditing and decentralized version history"

[features]
default = ["client"]
client = []
server = []

[[bin]]
name = "wasm-git"
path = "src/main.rs"
required-features = ["client"]

[[bin]]
name = "wasm-git-server"
path = "src/server_main.rs"
required-features = ["server"]

[dependencies]
base64 = "=0.22.1"
bincode = "=1.3.3"
crc32fast = "1"
zstd = { version = "=0.13.3", default-features = false }
wasmparser = "=0.249.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
colored = "2"
similar = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
ignore = "=0.4.33"
globset = "=0.4.20"
ed25519-dalek = "=2.2.0"
getrandom = "=0.3.4"
zeroize = "=1.9.1"
gimli = { version = "=0.34.0", default-features = false, features = ["read", "std"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = "=1.11.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
wat = "=1.249.0"
wast = "=249.0.0"

[patch.crates-io]
wasmparser = { path = "vendor/wasmparser" }
