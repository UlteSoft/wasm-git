name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/target
      TMPDIR: ${{ github.workspace }}/.tmp/temp
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.tmp/pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: mkdir -p .tmp/target .tmp/temp .tmp/pycache
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.93.1
          cache-workspaces: . -> .tmp/target
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/release.py inventory
      - run: cargo fmt --check
      - run: python3 tools/test-wasm-features.py
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked --all-features
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent Web GUI and bilingual capability coverage
        env:
          WASM_GIT_CLIENT: ${{ github.workspace }}/.tmp/target/debug/wasm-git
          WASM_GIT_SERVER: ${{ github.workspace }}/.tmp/target/debug/wasm-git-server
        run: |
          python3 webgui/test_webgui.py
          node webgui/test_catalog.cjs
          for source in webgui/static/*.js; do node --check "$source"; done
      - run: cargo test --locked --no-default-features --features client --test build_modes
      - run: cargo check --locked --no-default-features --features server --lib --bins
  release-builds:
    uses: ./.github/workflows/release-build.yml
