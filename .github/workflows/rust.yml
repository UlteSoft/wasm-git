name: Build checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/target
      TMPDIR: ${{ github.workspace }}/.tmp/temp
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p .tmp/target .tmp/temp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
          cache-workspaces: . -> .tmp/target
      - run: python tools/release.py inventory
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      # Runtime tests intentionally run only in the existing qualification cgroup.
      - run: cargo test --locked --all-features --all-targets --no-run
  release-builds:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/release-build.yml
